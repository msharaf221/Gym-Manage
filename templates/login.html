<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - {{ gym_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #111827 0%, {{ primary_color }} 100%);
    }
    .login-card { width: 400px; max-width: 92vw; border: none; border-radius: 1.2rem; }
    .logo { width: 72px; height: 72px; border-radius: 1rem; display: flex; align-items: center;
            justify-content: center; font-size: 2rem; color: #fff; background: {{ primary_color }}; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="card login-card shadow">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <div class="logo"><i class="bi bi-lightning-charge-fill"></i></div>
        <h4 class="mt-3 mb-0">{{ gym_name }}</h4>
        <div class="text-muted small">نظام إدارة الجيم</div>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label small fw-semibold">اسم المستخدم</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold">كلمة المرور</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" class="form-control" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">تسجيل الدخول</button>
      </form>
      <div class="text-center text-muted small mt-3">الدخول الافتراضي: <code>admin / admin123</code></div>
      <div class="text-center mt-2">
        <a href="{{ url_for('member_portal') }}" class="small text-decoration-none"><i class="bi bi-person-badge"></i> عضو؟ استعلم عن اشتراكك هنا</a>
      </div>
    </div>
  </div>
</body>
</html>
